{% extends "base.html" %}
{% block title %}Sign in · Kino{% endblock %}
{% block content %}<section class="auth-panel"><p class="eyebrow">Your film library</p><h1>Sign in</h1><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="form-field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<input type="hidden" name="next" value="{{ next }}"><button class="button" type="submit">Sign in</button></form><p class="auth-footnote">New to Kino? <a href="{% url 'register' %}">Create an account</a>.</p></section>{% endblock %}
