services:
  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - kino-data:/data

  sync-worker:
    build: .
    command: python manage.py run_sync_worker
    env_file: .env
    depends_on:
      - web
    volumes:
      - .:/app
      - kino-data:/data

volumes:
  kino-data: